%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/kinetic,ktz8866.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Kinetic Technologies KTZ8866/KTZ8868 backlight

maintainers:
  - Jianhua Lu <lujianhua000@gmail.com>

description: |
  The Kinetic Technologies KTZ8866 is a high efficiency 6-channels-current-sinks
  led backlight with dual lcd bias power.
  https://www.kinet-ic.com/ktz8866/

  The KTZ8868 is register compatible with the KTZ8866. Besides the HWEN pin,
  KTZ8868 designs can additionally wire ENP and ENN pins to enable the lcd
  bias outputs, hence up to three enable GPIOs.

  Without a led child node the chip registers a backlight device. A KTZ8868
  may instead describe its LED string in a led child node, which the chip
  registers as an LED class device. This allows boards that light one panel
  from several chips to combine them in a single led-backlight device.

allOf:
  - $ref: common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: kinetic,ktz8866
    then:
      properties:
        led: false
  - if:
      required:
        - led
    then:
      properties:
        current-num-sinks: false
        default-brightness: false
        max-brightness: false
        brightness-levels: false
        default-brightness-level: false

properties:
  compatible:
    enum:
      - kinetic,ktz8866
      - kinetic,ktz8868

  reg:
    maxItems: 1

  vddpos-supply:
    description: positive boost supply regulator.

  vddneg-supply:
    description: negative boost supply regulator.

  enable-gpios:
    description: GPIOs to enable the backlight (HWEN, and optionally ENP/ENN).
    minItems: 1
    maxItems: 3

  current-num-sinks:
    description:
      Number of the LED current sinks' channels, starting from LED1. Not used
      together with a led child node, whose led-sources selects the sinks.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 3, 4, 5, 6]

  kinetic,current-ramp-delay-ms:
    description: |
      LED current ramping delay time in milliseconds, note that the
      case 1 will be mapped to 1μs.
    enum: [1, 2, 4, 8, 16, 32, 64, 128, 192, 256, 320, 384, 448, 512, 576, 640]

  kinetic,led-enable-ramp-delay-ms:
    description: |
      LED on/off ramping delay time in milliseconds, note that the case 0 will be
      mapped to 512μs because ktz8866 can't ramp faster than it.
    enum: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

  kinetic,enable-lcd-bias:
    description: Set if we want to output bias power supply for LCD.
    type: boolean

  led:
    type: object
    $ref: /schemas/leds/common.yaml#
    unevaluatedProperties: false
    description:
      LED string driven by the current sinks, registered as an LED class
      device instead of a backlight device.

    properties:
      led-sources:
        description:
          Current sinks the LED string is connected to. Sinks LED1 to LED6
          are numbered 0 to 5.
        minItems: 1
        maxItems: 6
        items:
          maximum: 5

    required:
      - led-sources

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@11 {
            compatible = "kinetic,ktz8866";
            reg = <0x11>;
            vddpos-supply = <&bl_vddpos_5p5>;
            vddneg-supply = <&bl_vddneg_5p5>;
            enable-gpios = <&tlmm 139 GPIO_ACTIVE_HIGH>;
            current-num-sinks = <5>;
            kinetic,current-ramp-delay-ms = <128>;
            kinetic,led-enable-ramp-delay-ms = <1>;
            kinetic,enable-lcd-bias;
        };
    };
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@11 {
            compatible = "kinetic,ktz8868";
            reg = <0x11>;
            enable-gpios = <&tlmm 15 GPIO_ACTIVE_HIGH>;

            led {
                function = LED_FUNCTION_BACKLIGHT;
                color = <LED_COLOR_ID_WHITE>;
                led-sources = <0 1 2 4 5>;
            };
        };
    };
