%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc1320cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC1320CS 13MP image sensor

maintainers:
  - yading <yading@users.noreply.github.com>

description: |
  The SmartSens SC1320CS is a 13MP RAW10 sensor with a 4-lane MIPI
  CSI-2 D-PHY output.  The chip identifies as 0xc658 in the 16-bit
  register 0x3107.  The native readout is 4160x3120; the driver also
  supports a 2104x1560 2x2-binned preview readout.

  On the OnePlus Pad 2 Pro (SM8750) this is the rear main sensor on
  CCI0 master 1 (I2C 0x36), fed by a 19.2 MHz MCLK whose enable bits
  sit inside the CAM_CC_TITAN_TOP_GDSC power domain, and feeding CAMSS
  CSIPHY4 at 1200 Mbps/lane (600 MHz DDR link clock).

properties:
  compatible:
    const: smartsens,sc1320cs

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: 19.2 MHz MCLK feeding the sensor

  clock-names:
    const: cam_clk

  power-domains:
    maxItems: 1
    description:
      Power domain gating the sensor MCLK branch (CAM_CC_TITAN_TOP_GDSC);
      with the domain off, clk_prepare_enable() on the MCLK fails with
      -EBUSY.

  reset-gpios:
    maxItems: 1

  orientation: true
  rotation: true

  cam_vana-supply:
    description: Analog supply (2.8 V)

  cam_vio-supply:
    description: I/O supply (1.8 V)

  cam_vdig-supply:
    description: Digital core supply (1.2 V)

  cam_vaf-supply:
    description: AF actuator supply (2.8 V), shared with the module VCM

  lens-focus:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the module's focus actuator subnode

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            description: The sensor uses four MIPI data lanes.
            minItems: 4
            maxItems: 4

          link-frequencies:
            items:
              - enum: [600000000]

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - cam_vana-supply
  - cam_vio-supply
  - cam_vdig-supply
  - cam_vaf-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      sensor@36 {
        compatible = "smartsens,sc1320cs";
        reg = <0x36>;

        clocks = <&cam_bist_mclk 1>;
        clock-names = "cam_clk";
        assigned-clocks = <&cam_bist_mclk 1>;
        assigned-clock-rates = <19200000>;

        power-domains = <&titan_top_gdsc>;
        reset-gpios = <&pm8550ve_gpios 5 GPIO_ACTIVE_LOW>;

        orientation = <1>;
        rotation = <0>;

        cam_vana-supply = <&vreg_l16b_2p8>;
        cam_vio-supply = <&vreg_l4b_1p8>;
        cam_vdig-supply = <&vreg_l1i_1p2>;
        cam_vaf-supply = <&vreg_l9b_2p9>;

        port {
          endpoint {
            remote-endpoint = <&csiphy4_in>;
            data-lanes = <0 1 2 3>;
            link-frequencies = /bits/ 64 <600000000>;
          };
        };
      };
    };
...
