%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc820cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC820CS 8MP image sensor

maintainers:
  - yading <yading@users.noreply.github.com>

description: |
  The SmartSens SC820CS is an 8MP RAW10 sensor with a 4-lane MIPI
  CSI-2 D-PHY output; the native readout is 3264x2448.  The chip
  identifies as 0xd154 in the 16-bit register 0x3107.

  On the OnePlus Pad 2 Pro (SM8750) this is the front sensor.  It
  sits on a plain QUP I2C bus at the 7-bit address 0x10 (the vendor
  tree's 0x20 is the 8-bit write form), is fed by a 19.2 MHz MCLK
  whose enable bits sit inside the CAM_CC_TITAN_TOP_GDSC power
  domain, and feeds CAMSS CSIPHY5.  With both PLLs closed at divider
  2 the link runs at 528 Mbps/lane (264 MHz DDR link clock).  The
  module is mounted upside down; boards describe this with
  rotation = <180>.

properties:
  compatible:
    const: smartsens,sc820cs

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: 19.2 MHz MCLK feeding the sensor

  power-domains:
    maxItems: 1
    description:
      Power domain gating the sensor MCLK branch (CAM_CC_TITAN_TOP_GDSC);
      with the domain off, clk_prepare_enable() on the MCLK fails with
      -EBUSY.

  reset-gpios:
    maxItems: 1

  orientation: true
  rotation: true

  dovdd-supply:
    description: I/O supply (1.8 V)

  avdd-supply:
    description: Analog supply (2.8 V)

  dvdd-supply:
    description: Digital core supply (1.2 V)

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        additionalProperties: false

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                description: The sensor uses four MIPI data lanes.
                minItems: 4
                maxItems: 4

              link-frequencies:
                items:
                  - enum: [264000000]

            required:
              - data-lanes
              - link-frequencies

    required:
      - port@0

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      sensor@10 {
        compatible = "smartsens,sc820cs";
        reg = <0x10>;

        clocks = <&cam_bist_mclk 4>;
        assigned-clocks = <&cam_bist_mclk 4>;
        assigned-clock-rates = <19200000>;

        power-domains = <&titan_top_gdsc>;
        reset-gpios = <&tlmm 7 GPIO_ACTIVE_LOW>;

        orientation = <2>;
        rotation = <180>;

        dovdd-supply = <&vreg_l4b_1p8>;
        avdd-supply = <&vreg_l16b_2p8>;
        dvdd-supply = <&vreg_l11b_1p2>;

        ports {
          #address-cells = <1>;
          #size-cells = <0>;

          port@0 {
            reg = <0>;

            endpoint {
              remote-endpoint = <&csiphy5_in>;
              data-lanes = <0 1 2 3>;
              link-frequencies = /bits/ 64 <264000000>;
            };
          };
        };
      };
    };
...
