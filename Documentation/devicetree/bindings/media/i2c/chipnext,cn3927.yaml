%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/chipnext,cn3927.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chipnext CN3927 camera voice coil motor actuator

maintainers:
  - yading <yading@users.noreply.github.com>

description: |
  The CN3927 is a 10-bit voice coil motor driver for camera focus
  actuators.  The I2C register protocol uses 8-bit register addresses;
  the focus position is a 10-bit DAC split across registers 0x03
  (MSB[1:0]) and 0x04 (LSB), and the chip requires an unlock/init
  sequence before it accepts position updates.

  Hardware verified on the OnePlus Pad 2 Pro rear camera module
  (SM8750, CCI0 master 1, slave address 0x0c).

properties:
  compatible:
    const: chipnext,cn3927

  reg:
    maxItems: 1

  vio-supply:
    description: I/O voltage supply (1.8 V)

  vaf-supply:
    description: AF actuator voltage supply (2.9 V)

required:
  - compatible
  - reg
  - vio-supply
  - vaf-supply

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      lens@c {
        compatible = "chipnext,cn3927";
        reg = <0x0c>;
        vio-supply = <&vreg_l4b_1p8>;
        vaf-supply = <&vreg_l9b_2p9>;
      };
    };
...
