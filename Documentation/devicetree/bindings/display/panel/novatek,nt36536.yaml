%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt36536.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36536 based dual-link DSI display panels

maintainers:
  - Erwin <yzddmr7@gmail.com>

description:
  The Novatek NT36536 is a generic DSI panel IC used to drive video mode
  panels with Display Stream Compression (DSC) over two bonded DSI links,
  such as the CSOT XN242 found in the OnePlus Pad 2 Pro tablet.

allOf:
  - $ref: panel-common-dual.yaml#

properties:
  compatible:
    const: novatek,nt36536

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vddio-supply:
    description: power supply for the IC I/O interface

  backlight: true
  ports: true

required:
  - compatible
  - reg
  - vddio-supply
  - reset-gpios
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "novatek,nt36536";
            reg = <0>;

            vddio-supply = <&vreg_l12b_1p8>;
            reset-gpios = <&tlmm 98 GPIO_ACTIVE_LOW>;
            backlight = <&backlight>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    panel_in_0: endpoint {
                        remote-endpoint = <&dsi0_out>;
                    };
                };

                port@1 {
                    reg = <1>;
                    panel_in_1: endpoint {
                        remote-endpoint = <&dsi1_out>;
                    };
                };
            };
        };
    };

...
